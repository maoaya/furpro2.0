# =============================================================================
# ZONA PRO — ÚNICA versión de producción
# publish = producto-deploy (contenido del ZIP deploy-6a7256d5ffd58e44433d5158)
# NUNCA publish=dist ni command=npm run build del src/ enero.
# El netlify.toml DENTRO del ZIP del PC es Windows (rutas absolutas) — NO usarlo aquí.
# Ver: auditoria/AUDITORIA_CONTEXTO_PRODUCTO_ZONA_PRO.md
# =============================================================================
[build]
  publish = "producto-deploy"
  command = "node scripts/ensure-producto-deploy.mjs"
  ignore = "false"
  functions = "functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# API → functions (paridad con deploy del PC; sin rutas Windows)
[[redirects]]
  from = "/api/video/transcode/*"
  to = "/.netlify/functions/video-transcode/:splat"
  status = 200

[[redirects]]
  from = "/api/video/transcode"
  to = "/.netlify/functions/video-transcode"
  status = 200

[[redirects]]
  from = "/api/webhooks/*"
  to = "/.netlify/functions/webhooks/:splat"
  status = 200

[[redirects]]
  from = "/api/team-shield"
  to = "/.netlify/functions/team-shield"
  status = 200

[[redirects]]
  from = "/api/events/*"
  to = "/.netlify/functions/events-qr/:splat"
  status = 200

[[redirects]]
  from = "/api/events"
  to = "/.netlify/functions/events-qr"
  status = 200

[[redirects]]
  from = "/api/gestion-torneo"
  to = "/.netlify/functions/gestion-torneo"
  status = 200

[[redirects]]
  from = "/api/configurar-jugadores-torneo"
  to = "/.netlify/functions/configurar-jugadores-torneo"
  status = 200

[[redirects]]
  from = "/api/responder-invitacion-torneo"
  to = "/.netlify/functions/responder-invitacion-torneo"
  status = 200

[[redirects]]
  from = "/api/invitar-equipo-torneo"
  to = "/.netlify/functions/invitar-equipo-torneo"
  status = 200

[[redirects]]
  from = "/api/crear-encuentro-vs"
  to = "/.netlify/functions/crear-encuentro-vs"
  status = 200

# Proxy TheSportsDB / fixtures / live (el bundle llama POST /api/zona-pro? action=sportsdb|…)
# Sin esta function el cliente cae al fetch directo → CORS + 429 en localhost/preview.
[[redirects]]
  from = "/api/zona-pro"
  to = "/.netlify/functions/zona-pro-ai"
  status = 200

[[redirects]]
  from = "/api/zona-pro/*"
  to = "/.netlify/functions/zona-pro-ai/:splat"
  status = 200

# SPA fallback (debe ir al final)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
