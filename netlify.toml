# Zona Pro — publicar deploy del producto (no rebuild de src enero)
[build]
  publish = "producto-deploy"
  command = "echo 'Using prebuilt producto-deploy (Zona Pro)'"
  ignore = "false"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
