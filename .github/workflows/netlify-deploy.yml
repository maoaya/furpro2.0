name: Deploy to Netlify (Zona Pro / producto-deploy)

# Despliega SOLO producto-deploy. Nunca reconstruye el src/ de enero.
on:
  workflow_dispatch:

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  deploy-producto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar producto canónico
        run: node scripts/ensure-producto-deploy.mjs

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy producto-deploy a producción
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: netlify deploy --prod --dir=producto-deploy --site=${{ secrets.NETLIFY_SITE_ID }}
